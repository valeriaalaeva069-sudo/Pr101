name: Production Release

# ПР 11 — Шаг 2.3: автоматическая публикация в Google Play при теге v*
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    # Подпись APK/AAB берётся из секретов репозитория
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    # 1. Получаем код
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. JDK 25 (как в android.yml)
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 25

    # 3. Кэш Gradle
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Make gradlew executable
      run: chmod +x gradlew

    # 4. Расшифровываем keystore.jks из base64
    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks

    # 5. Расшифровываем google-services.json (для Firebase Remote Config + Crashlytics)
    - name: Decode google-services.json
      env:
        GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

    # 6. Собираем релиз (APK для артефакта + AAB для Google Play)
    - name: Assemble Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Bundle Release AAB
      run: ./gradlew bundleRelease --no-daemon

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: app/build/outputs/bundle/release/app-release.aab

    # 7. Fastlane: публикуем в Google Play
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - name: Install Fastlane
      run: bundle install

    # 7a. Загрузить AAB в Internal Testing
    - name: Publish to Internal Testing
      env:
        PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      run: bundle exec fastlane internal

    # 7b. Продвинуть Internal -> Production
    - name: Promote to Production
      env:
        PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      run: bundle exec fastlane promote_prod